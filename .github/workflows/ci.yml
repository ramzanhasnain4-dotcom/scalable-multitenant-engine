name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Pytest
      run: |
        cd backend
        pytest -v --tb=short

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t multitenant-engine-test ./backend

    - name: Verify container starts
      run: |
        docker run -d --name engine-smoke-test \
          -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
          multitenant-engine-test || true
        sleep 3
        docker logs engine-smoke-test 2>&1 || true
        docker stop engine-smoke-test || true